name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Declared here rather than on the signing steps themselves: a step's own
    # env block is not in scope for that same step's if condition, so the
    # skip-when-unset check would never fire. Absent secrets expand to the
    # empty string, which is exactly the signal we want.
    env:
      SIGN_CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux,   os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v4

      # JUCE needs these to build anything with a GUI on Linux. webkit is not
      # in the list because JUCE_WEB_BROWSER is off.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Fetch fonts
        shell: bash
        run: ./Tools/fetch_fonts.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel 4

      # The DSP tests are headless by design, so they run everywhere without a
      # display server.
      # -C matters on Windows: Visual Studio is a multi-config generator, so
      # the build type is chosen here rather than at configure time, and
      # without it ctest finds no tests at all.
      - name: Unit tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # Reported, not gated. The budgets are real, but a runner this size and
      # this shared cannot measure them meaningfully - the numbers are here to
      # be read, and the enforcing happens on hardware we know.
      - name: Performance budgets (informational)
        shell: bash
        continue-on-error: true
        run: |
          T=$(find build -name "DrawEQTests" -o -name "DrawEQTests.exe" | head -1)
          "$T" "[performance]" --success || true

      # Exercises the VST3 boundary rather than the DSP classes: bus
      # negotiation, the parameter interface, the state blob, latency changes.
      # Located by name rather than by permission bit: the executable bit does
      # not survive on Windows checkouts, so -perm -u+x matches nothing there.
      - name: Host simulation
        shell: bash
        run: |
          VST3=$(find build -name "*.vst3" | head -1)
          SIM=$(find build -name "DrawEQHostSim" -o -name "DrawEQHostSim.exe" | head -1)
          echo "running $SIM against $VST3"
          "$SIM" "$VST3"

      - name: Fit benchmark
        shell: bash
        run: |
          BENCH=$(find build -name "DrawEQFitBench" -o -name "DrawEQFitBench.exe" | head -1)
          "$BENCH" 24

      - name: Fetch pluginval
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip
          else
            curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Linux.zip
          fi
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z x pluginval.zip -aoa
          else
            unzip -oq pluginval.zip
          fi

      # Strictness 10, as required. --skip-gui-tests only on
      # Linux CI, which has no display server; the GUI tests do run locally and
      # on Windows.
      - name: pluginval
        shell: bash
        run: |
          VST3=$(find build -name "*.vst3" | head -1)
          echo "validating $VST3"
          if [ "$RUNNER_OS" == "Linux" ]; then
            ./pluginval --strictness-level 10 --skip-gui-tests --validate "$VST3"
          else
            ./pluginval.exe --strictness-level 10 --validate "$VST3"
          fi

      # ---- Windows packaging -------------------------------------------
      #
      # Everything below runs only on Windows and only after pluginval has
      # passed, so nothing that failed validation can end up in an installer.

      - name: Install WiX
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      # Signing needs a certificate that only the repository owner has, so the
      # secrets are absent on forks and pull requests by design. When they are
      # absent this step is skipped and the build continues unsigned rather
      # than failing - an unsigned build is still a usable build, it just warns
      # on first run. Binaries are signed before packaging so the MSI carries
      # signed payloads, and the MSI itself is signed afterwards.
      - name: Sign binaries
        if: runner.os == 'Windows' && env.SIGN_CERT_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          # The timestamp is not optional in practice: without one the
          # signature stops verifying the day the certificate expires.
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "build/DrawEQ_artefacts/RelWithDebInfo/VST3/DrawEQ.vst3/Contents/x86_64-win/DrawEQ.vst3" `
            "build/DrawEQ_artefacts/RelWithDebInfo/Standalone/DrawEQ.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force

      - name: Build MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./Installer/build-msi.sh \
            "build/DrawEQ_artefacts/RelWithDebInfo/VST3/DrawEQ.vst3" \
            "build/DrawEQ_artefacts/RelWithDebInfo/Standalone/DrawEQ.exe" \
            "DrawEQ.msi"

      - name: Sign MSI
        if: runner.os == 'Windows' && env.SIGN_CERT_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "DrawEQ.msi"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force

      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DrawEQ-Windows-Installer
          path: DrawEQ.msi
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DrawEQ-${{ matrix.name }}-VST3
          path: build/DrawEQ_artefacts/RelWithDebInfo/VST3
          if-no-files-found: error

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: DrawEQ-${{ matrix.name }}-Standalone
          path: build/DrawEQ_artefacts/RelWithDebInfo/Standalone
          if-no-files-found: error

  # Tag a commit v0.9.0 and push the tag, and the artefacts that job just
  # validated become a public download. Nothing is rebuilt here: the release
  # carries the exact binaries pluginval passed, not a second build of the
  # same source that nobody checked.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DrawEQ-Windows-*
          path: artefacts

      # A zip beside the installer, for anyone who would rather drop the
      # folder into their own VST3 directory than run an installer.
      - name: Package the plugin folder
        run: |
          cd artefacts/DrawEQ-Windows-VST3
          zip -qr ../../DrawEQ-Windows-VST3.zip DrawEQ.vst3

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artefacts/DrawEQ-Windows-Installer/DrawEQ.msi
            DrawEQ-Windows-VST3.zip
